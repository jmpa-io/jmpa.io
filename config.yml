baseURL: https://jmpa.io
languageCode: en-us
title: jmpa

Params:
  # Theme variant: 1 midnight terminal, 2 deep ocean, 3 blueprint. Change this one value to pick the default (?v=1|2|3 previews another).
  variant: 1
  description: "jmpa.io - the front door to my corner of the internet: art, blog, portfolio and start page."
  eyebrow: "Jordan Cleal · Melbourne"
  heading: "Everything, in one place."
  sub: "Art, writing, projects and a start page."
  footerTagline: "The front door to everything Jordan makes."
  # The places listed on the page (buttons, footer icons) come from data/links.yml.

markup:
  goldmark:
    renderer:
      unsafe: true

# a single page: the home page (plus 404.html).
disableKinds:
  - taxonomy
  - term
  - RSS
  - section

# Only these paths are part of the site, so stray local files (old content/ or layouts/ experiments) can't break or extend the build.
module:
  mounts:
    - { source: content/_index.md, target: content/_index.md }
    - { source: layouts/index.html, target: layouts/index.html }
    - { source: layouts/404.html, target: layouts/404.html }
    - { source: layouts/partials, target: layouts/partials }
    - { source: data/links.yml, target: data/links.yml }
    - { source: static, target: static }
