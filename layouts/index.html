<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
<title>{{ .Site.Title }}</title>
<meta name="description" content="{{ .Site.Params.description }}" />
<meta name="theme-color" content="#0b1020" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="/css/simple.css" />
</head>
<body>
<main>
  <img class="hero" src="/programming.gif" width="480" height="320" alt="Pixel art of me programming at a desk" />
  <ul>
    {{ range .Site.Data.links.categories }}{{ range .links }}
    <li><a href="{{ .url }}"{{ if .external }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .name }}</a></li>
    {{ end }}{{ end }}
    {{ range .Site.Data.links.footer }}
    <li><a href="{{ .url }}"{{ if .external }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .name }}</a></li>
    {{ end }}
  </ul>
</main>
</body>
</html>
