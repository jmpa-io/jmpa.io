<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
{{- partial "head.html" . -}}
</head>
<body>
  <main>
    <canvas id="room" width="192" height="108" role="img"
      aria-label="Pixel art of a person with headphones typing at a glowing computer in a dark room, rain falling outside the window."></canvas>
    <h1>jmpa<span class="cursor">_</span></h1>
    <p class="sub">something is brewing. in the meantime:</p>
    <nav aria-label="Links">
      {{- range .Site.Data.links }}
      <section class="group" aria-labelledby="cat-{{ .id }}">
        <h2 id="cat-{{ .id }}">{{ .category }}</h2>
        <ul>
          {{- range .links }}
          <li><a href="{{ .url }}"{{ if .external }} target="_blank" rel="noopener noreferrer"{{ end }}{{ with .label }} aria-label="{{ . }}"{{ end }}>{{ if eq .icon "github" }}{{ partial "github-icon.html" . }}{{ end }}{{ .name }}</a></li>
          {{- end }}
        </ul>
      </section>
      {{- end }}
    </nav>
  </main>
  <script src="/js/room.js"></script>
</body>
</html>
