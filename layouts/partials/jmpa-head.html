<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Site.Params.description }}" />
<meta name="theme-color" content="#0a2a6b" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ .Site.Title }}" />
<meta property="og:description" content="{{ .Site.Params.description }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<meta property="og:image" content="{{ "og-image.png" | absURL }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="{{ "og-image.png" | absURL }}" />
<link rel="preload" href="/fonts/silkscreen-bold.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/silkscreen-regular.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/css/pixel.css" />
<!-- colours + day/night are applied here, before first paint; the default pair is navy (art.jmpa.io keeps sunset) -->
<script src="/js/palette.js"></script>
<script src="/js/init.js"></script>
