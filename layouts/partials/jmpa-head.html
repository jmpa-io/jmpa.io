<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/jmpa.css" />
<!-- prevent theme/palette flash -->
<script>(function(){
  var t=localStorage.getItem('jmpa-theme');
  if(t==='dark')document.documentElement.classList.add('dark');
  var p=localStorage.getItem('jmpa-palette');
  var palettes=['ocean','forest','sunset','violet','yellow','grey','purple'];
  if(p&&palettes.indexOf(p)!==-1)document.documentElement.classList.add(p);
})()</script>
<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
{{ with .Site.Params.inventoryUrl }}<script>window.JMPA_INVENTORY_URL = {{ . | jsonify }};</script>{{ end }}
<script src="/js/jmpa.js" defer></script>
