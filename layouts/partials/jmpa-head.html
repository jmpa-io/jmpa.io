<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Site.Params.description }}" />
<meta name="theme-color" content="{{ index (slice "#070b16" "#06161f" "#0f1724") (sub (int (.Site.Params.variant | default 1)) 1) }}" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
{{- $share := printf "/share-v%d.png" (int (.Site.Params.variant | default 1)) }}
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ .Site.Title }}" />
<meta property="og:description" content="{{ .Site.Params.description }}" />
<meta property="og:image" content="{{ $share | absURL }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="{{ $share | absURL }}" />
<link rel="preload" href="/hoodie-64.png" as="image" type="image/png" />
<link rel="preload" href="/fonts/firacode-400.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/firacode-700.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/css/pixel.css" />
<!-- colours + day/night are applied here, before first paint; the default pair and scheme come from the theme variant (init.js) -->
<script src="/js/palette.js"></script>
<script src="/js/init.js"></script>
