<nav class="jmpa-nav">
  <a href="{{ .Site.BaseURL }}" class="jmpa-nav-logo">
    <img src="/logo.png" alt="jmpa" class="jmpa-nav-logo-img" />
    <span class="jmpa-brand">jmpa<span class="jmpa-brand-tld">.io</span></span>
  </a>
  <div class="jmpa-nav-links">
    {{ $permalink := .RelPermalink }}
    {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" {{ if or (eq $permalink .URL) (and (ne .URL "/") (hasPrefix $permalink .URL)) }}class="active"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </div>
  <button class="jmpa-theme-btn" id="theme-toggle" aria-label="Toggle theme">
    <span class="icon-moon">☽</span>
    <span class="icon-sun">☀</span>
  </button>
  <button class="jmpa-cart-btn" onclick="toggleCart()" aria-label="Cart">
    🛒 <span class="jmpa-cart-count" id="cart-count">0</span>
  </button>
</nav>
