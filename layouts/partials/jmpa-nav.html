<div class="jmpa-blob jmpa-blob-a" aria-hidden="true"></div>
<div class="jmpa-blob jmpa-blob-b" aria-hidden="true"></div>
<div class="jmpa-blob jmpa-blob-c" aria-hidden="true"></div>
<div class="jmpa-blob jmpa-blob-d" aria-hidden="true"></div>
<nav class="jmpa-nav">
  <div class="jmpa-nav-inner">
    <a href="/" class="jmpa-nav-logo">
      <img class="jmpa-nav-logo-img" src="/logo.png" alt="jmpa" />
      <span class="jmpa-brand">jmpa<span class="jmpa-brand-tld">.io</span></span>
    </a>
    <div class="jmpa-nav-links">
      {{ $permalink := .RelPermalink }}
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" {{ if or (eq $permalink .URL) (and (ne .URL "/") (hasPrefix $permalink .URL)) }}class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </div>
    <div class="jmpa-palette-wrap">
      <button class="jmpa-palette-trigger" id="jmpa-palette-trigger" aria-label="Colour theme">
        <svg width="13" height="13" viewBox="0 0 13 13"><circle cx="6.5" cy="6.5" r="5" fill="var(--muted)"/></svg>
      </button>
      <div class="jmpa-palette-popup" id="jmpa-palette-popup">
        <button class="jmpa-palette-btn" data-palette="ocean"  title="Ocean"><svg  width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1a7ab0"/></svg></button>
        <button class="jmpa-palette-btn" data-palette="forest" title="Forest"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#2a7a30"/></svg></button>
        <button class="jmpa-palette-btn" data-palette="sunset" title="Sunset"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#c04828"/></svg></button>
        <button class="jmpa-palette-btn" data-palette="violet" title="Violet"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#6a30b0"/></svg></button>
        <button class="jmpa-palette-btn" data-palette="yellow" title="Yellow"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#b89000"/></svg></button>
        <button class="jmpa-palette-btn" data-palette="grey"   title="Grey"><svg   width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#7080a0"/></svg></button>
        <button class="jmpa-palette-btn" data-palette="purple" title="Magenta"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#d01880"/></svg></button>
        <button class="jmpa-palette-btn" data-palette=""       title="Default"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#1c1a17"/></svg></button>
      </div>
    </div>
    <button class="jmpa-theme-btn" id="theme-toggle" aria-label="Toggle theme" data-tip="Theme"></button>
    <button class="jmpa-cart-btn" onclick="toggleCart()" aria-label="Cart" data-tip="Cart">
      <span id="cart-icon"></span><span class="jmpa-cart-count" id="cart-count">0</span>
    </button>
  </div>
</nav>
