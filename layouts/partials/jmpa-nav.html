<div class="jmpa-blob jmpa-blob-a" aria-hidden="true"></div>
<div class="jmpa-blob jmpa-blob-b" aria-hidden="true"></div>
<div class="jmpa-blob jmpa-blob-c" aria-hidden="true"></div>
<div class="jmpa-blob jmpa-blob-d" aria-hidden="true"></div>
{{ $links := where .Site.Data.links "nav" true }}
<nav class="jmpa-nav" aria-label="Main">
  <div class="jmpa-nav-inner">
    <a href="/" class="jmpa-nav-logo">
      <img class="jmpa-nav-logo-img" src="/logo.png" alt="" />
      <span class="jmpa-brand">jmpa<span class="jmpa-brand-tld">.io</span></span>
    </a>
    <div class="jmpa-nav-links">
      {{ range $links }}<a href="{{ .url }}">{{ .name }}</a>{{ end }}
    </div>
    <div class="jmpa-palette-wrap">
      <button class="jmpa-palette-trigger" id="jmpa-palette-trigger" aria-label="Colours" aria-haspopup="true" aria-expanded="false">
        <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><path class="p1" d="M6.5 1.5a5 5 0 0 0 0 10z"/><path class="p2" d="M6.5 1.5a5 5 0 0 1 0 10z"/></svg>
      </button>
      <div class="jmpa-palette-popup" id="jmpa-palette-popup" role="dialog" aria-label="Colours">
        <label>Primary <input type="color" id="jmpa-custom-primary" value="#0a2a6b"></label>
        <label>Secondary <input type="color" id="jmpa-custom-secondary" value="#2f7fae"></label>
        <button type="button" class="jmpa-custom-reset" id="jmpa-custom-reset">Reset</button>
        <span class="jmpa-custom-note" id="jmpa-custom-note" role="status"></span>
      </div>
    </div>
    <button class="jmpa-theme-btn" id="theme-toggle" aria-label="Toggle theme" data-tip="Theme"></button>
    <button class="jmpa-hamburger" id="jmpa-hamburger" aria-label="Menu" aria-expanded="false" aria-controls="jmpa-mobile-menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>
<div class="jmpa-mobile-menu" id="jmpa-mobile-menu" aria-hidden="true">
  {{ range $links }}<a href="{{ .url }}">{{ .name }}</a>{{ end }}
</div>
