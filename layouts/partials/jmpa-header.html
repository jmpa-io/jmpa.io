<header class="bar">
  <a href="/" class="logo" aria-label="jmpa.io home">
    <img class="logo-mark" src="/hoodie-64.png" width="32" height="32" alt="" />
    <span>jmpa.io</span>
  </a>
  <div class="palette-wrap">
    <button class="px-btn" id="jmpa-palette-trigger" aria-label="Colours" aria-haspopup="true" aria-expanded="false">
      <svg class="pal-icon" viewBox="0 0 12 12" aria-hidden="true"><g class="ring"><rect x="3" y="0" width="6" height="1"/><rect x="1" y="1" width="10" height="1"/><rect x="0" y="2" width="12" height="8"/><rect x="1" y="10" width="10" height="1"/><rect x="3" y="11" width="6" height="1"/></g><g class="p1"><rect x="3" y="1" width="3" height="1"/><rect x="2" y="2" width="4" height="1"/><rect x="1" y="3" width="5" height="6"/><rect x="2" y="9" width="4" height="1"/><rect x="3" y="10" width="3" height="1"/></g><g class="p2"><rect x="6" y="1" width="3" height="1"/><rect x="6" y="2" width="4" height="1"/><rect x="6" y="3" width="5" height="6"/><rect x="6" y="9" width="4" height="1"/><rect x="6" y="10" width="3" height="1"/></g></svg>
    </button>
    <div class="palette-popup" id="jmpa-palette-popup" role="dialog" aria-label="Colours">
      <label>Primary <input type="color" id="jmpa-custom-primary" value="#0a2a6b"></label>
      <label>Secondary <input type="color" id="jmpa-custom-secondary" value="#2f7fae"></label>
      <button type="button" class="reset" id="jmpa-custom-reset">Reset</button>
      <span class="note" id="jmpa-custom-note" role="status"></span>
    </div>
  </div>
  <button class="px-btn" id="theme-toggle" aria-label="Toggle theme"></button>
</header>
