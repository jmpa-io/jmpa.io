<header class="bar">
  <a href="/" class="logo" aria-label="jmpa.io home">
    <img class="logo-mark" src="/hoodie-18.png" width="36" height="36" alt="" />
    <span>jmpa.io</span>
  </a>
  <div class="bar-tools">
    <button type="button" class="icon-btn" id="kb-toggle" aria-label="Show keyboard" aria-pressed="true" title="Keyboard">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    </button>
    <div class="palette-wrap">
      <button type="button" class="icon-btn" id="jmpa-palette-trigger" aria-label="Colours" aria-haspopup="true" aria-expanded="false">
        <svg class="pal-icon" viewBox="0 0 24 24" aria-hidden="true"><circle class="ring" cx="12" cy="12" r="9.5" stroke-width="1.8"/><path class="p1" d="M12 4a8 8 0 000 16z"/><path class="p2" d="M12 4a8 8 0 010 16z"/></svg>
      </button>
      <div class="palette-popup" id="jmpa-palette-popup" role="dialog" aria-label="Colours">
        <label>Primary <input type="color" id="jmpa-custom-primary" value="#4f8cff"></label>
        <label>Secondary <input type="color" id="jmpa-custom-secondary" value="#22d3ee"></label>
        <button type="button" class="reset" id="jmpa-custom-reset">Reset</button>
        <span class="note" id="jmpa-custom-note" role="status"></span>
      </div>
    </div>
    <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle theme"></button>
  </div>
</header>
