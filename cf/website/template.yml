---
AWSTemplateFormatVersion: 2010-09-09
Description: Reusable CloudFront + S3 static website stack.

Parameters:
  Repository:
    Description: The repository this stack is deployed from.
    Type: String

  HostedZoneId:
    Description: The ID for the domain registered via AWS Route53.
    Type: String

  Domain:
    Description: The domain registered.
    Type: String

  AcmCertificateArn:
    Description: The certificate verifying the given domain.
    Type: String

  AuthToken:
    Description: >
      base64 of dev:<password>, read from SSM. Sites in the dev account ask for it (HTTP basic auth); the value 'off'
      (prod) leaves the site public.
    Type: AWS::SSM::Parameter::Value<String>
    Default: /common/dev-site-auth/token

Conditions:
  CreateResources: !Equals [ !Ref "AWS::Region" , "ap-southeast-2" ]

Resources:
  Website:
    Type: AWS::S3::Bucket
    Condition: CreateResources
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref Domain
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - Key: repository
          Value: !Ref Repository

  # OAC replaces OAI. CloudFront authenticates to S3 using sigv4 — no public
  # access or website endpoint needed.
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CreateResources
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${Domain}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Allows CloudFront (via OAC) to read objects. No public access.
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateResources
    Properties:
      Bucket: !Ref Website
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${Website}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  DistributionLogBucket:
    Type: AWS::S3::Bucket
    Condition: CreateResources
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      # BucketOwnerPreferred (not BucketOwnerEnforced) is required so CloudFront log
      # delivery can write with s3:x-amz-acl: bucket-owner-full-control.
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      LifecycleConfiguration:
        Rules:
          - Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: repository
          Value: !Ref Repository

  DistributionLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateResources
    Properties:
      Bucket: !Ref DistributionLogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontAccessLogs
            Principal:
              Service: delivery.logs.amazonaws.com
            Effect: Allow
            Action: s3:PutObject
            Resource: !Sub 'arn:aws:s3:::${DistributionLogBucket}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control

  # S3 (via OAC) doesn't resolve "/about/" to "/about/index.html" the way the S3 website endpoint did, so rewrite
  # directory-style URLs before they reach the bucket. Paths with a file extension are left alone.
  DirectoryIndexFunction:
    Type: AWS::CloudFront::Function
    Condition: CreateResources
    Properties:
      # Function names can't contain dots.
      Name: !Sub
        - ${Slug}-directory-index
        - Slug: !Join [ "-", !Split [ ".", !Ref Domain ] ]
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for directory-style URLs, and ask for a password on dev.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
            var request = event.request;
            // Dev sites ask for a username and password. 'off' (prod) leaves the site public.
            var token = '${Token}';
            if (token !== 'off') {
              var auth = request.headers.authorization;
              if (!auth || auth.value !== 'Basic ' + token) {
                return {
                  statusCode: 401,
                  statusDescription: 'Unauthorized',
                  headers: { 'www-authenticate': { value: 'Basic realm="dev"' } }
                };
              }
            }
            var uri = request.uri;
            if (uri.endsWith('/')) {
              request.uri += 'index.html';
            } else if (uri.indexOf('.', uri.lastIndexOf('/')) === -1) {
              request.uri += '/index.html';
            }
            return request;
          }
        - Token: !Ref AuthToken

  Distribution:
    Type: AWS::CloudFront::Distribution
    Condition: CreateResources
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Ref Website
        Origins:
          - Id: S3Origin
            DomainName: !Sub "${Website}.s3.${AWS::Region}.amazonaws.com"
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
        HttpVersion: http2
        Aliases:
          - !Ref Website
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          Compress: true
          TargetOriginId: S3Origin
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized (AWS managed)
          ViewerProtocolPolicy: redirect-to-https
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndexFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
        Logging:
          Bucket: !Sub "${DistributionLogBucket}.s3.amazonaws.com"
          Prefix: !Ref Website
          IncludeCookies: false
      Tags:
        - Key: repository
          Value: !Ref Repository

  WebsiteRecordSet:
    Type: AWS::Route53::RecordSetGroup
    Condition: CreateResources
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref Website
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt Distribution.DomainName

Outputs:
  Bucket:
    Condition: CreateResources
    Description: The name of the S3 bucket used to host the website.
    Value: !Ref Website
