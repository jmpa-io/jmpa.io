---
AWSTemplateFormatVersion: 2010-09-09
Description: The cert configuration for 'jmpa.io'.

Parameters:
  Environment:
    Description: The environment used when deploying this service.
    Type: String
    AllowedValues: ["dev", "prod"] # dev certs live in the dev AWS account (Domain=dev.<site>).

  Domain:
    Description: The domain registered.
    Type: String

  HostedZoneId:
    Description: The ID for the domain registered, via AWS Route53.
    Type: String

Conditions:
  CreateResources: !Equals [ !Ref "AWS::Region", "us-east-1" ]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateResources
    Properties:
      DomainName: !Ref Domain
      SubjectAlternativeNames:
        - !Sub "*.${Domain}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Domain
          HostedZoneId: !Ref HostedZoneId

  CertificateParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/certs/${Domain}/arn"
      Type: String
      Value: !Ref Certificate
