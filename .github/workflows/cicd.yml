---
name: CI/CD
on:
  push:
    paths:
    - '.github/workflows/cicd.yml'
    - 'bin/*'
    - 'cf/**'
    - 'cmd/**'
    - 'content/**'
    - 'layouts/**'
    - 'static/**'
    - 'config.yml'
    - '**Dockerfile'
    - 'Makefile*'
  workflow_dispatch:
  repository_dispatch:
    types: [update-cicd]

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  lint:
    uses: jmpa-io/pipelines/.github/workflows/10-lint.yml@ce5c5b9a18da6c3975e7bd71f9f7c99b9b49ef2f # main (adds account_id)
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}
      ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}

  build-website:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Checkout theme submodule.
        run: git submodule update --init themes/jmpa

      - name: Generate website.
        run: make generate-website

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: jmpa.io
          path: dist/public
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [build-website]
    uses: jmpa-io/pipelines/.github/workflows/40-deploy-to-aws.yml@ce5c5b9a18da6c3975e7bd71f9f7c99b9b49ef2f # main (adds account_id)
    with:
      templates: website
      account_id: '213851291874' # the dev AWS account.
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}

  upload-website:
    needs: [deploy]
    uses: jmpa-io/pipelines/.github/workflows/50-upload-artifacts-to-s3.yml@ce5c5b9a18da6c3975e7bd71f9f7c99b9b49ef2f # main (adds account_id)
    with:
      artifact: jmpa.io
      account_id: '213851291874' # the dev AWS account.
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}

  # Prove the dev copy serves a directory URL (the home page and a subpage) before anything else
  # builds on it. CloudFront can lag a few seconds behind the stack update, so retry.
  smoke-test:
    needs: [upload-website]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the dev site.
        run: |
          for path in / /store/order-successful/; do
            curl -fsS --retry 8 --retry-delay 15 --retry-all-errors -o /dev/null "https://dev.jmpa.io${path}"
            echo "ok https://dev.jmpa.io${path}"
          done

  post-to-slack:
    needs: [lint, build-website, deploy, upload-website, smoke-test]
    if: always()
    uses: jmpa-io/pipelines/.github/workflows/99-post-to-slack.yml@ce5c5b9a18da6c3975e7bd71f9f7c99b9b49ef2f # main (adds account_id)
    with:
      needs: ${{ toJSON(needs) }}
    secrets:
      WEBHOOK: ${{ secrets.SLACK_GITHUB_NOTIFICATIONS_WEBHOOK }}
