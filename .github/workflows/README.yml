---
name: README.md
on:
  push:
    paths:
    - '.github/workflows/*'
    - 'img/*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  actions: read

jobs:
  generate-readme:
    uses: jmpa-io/pipelines/.github/workflows/00-README.yml@462acc0d5973ca1f6c014cbd422c266e576ddf17 # v1.0.0
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}
      ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}

  post-to-slack:
    needs: [generate-readme]
    if: always()
    uses: jmpa-io/pipelines/.github/workflows/99-post-to-slack.yml@0877ff2d3aa9a4add377ad679135ab5a5c3e2b8a # v1.1.0
    with:
      needs: ${{ toJSON(needs) }}
    secrets:
      WEBHOOK: ${{ secrets.SLACK_GITHUB_NOTIFICATIONS_WEBHOOK }}
